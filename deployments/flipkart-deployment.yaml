apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipkart-deployment
  namespace: shubha-ns
  labels:
    app: flipkart-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: flipkart
  template:
    metadata:
      labels:
        app: flipkart
    spec:
      containers:
        - name: flipkart-container
          image: muralisocial123/flipkart-clone-kuberox:v1.1.0
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"

---
apiVersion: v1
kind: Service
metadata: 
  name: flipkart-service
  namespace: shubha-ns
spec:
  selector:
    app: flipkart
  ports:
    - port: 3005
      targetPort: 80
      protocol: TCP
  type: ClusterIP